spring:
  application:
    name: llm-hello
  ai:
    openai:
      # 环境变量注入，不硬编码 key（面试展示时也是好习惯）
      api-key: ${LLM_API_KEY:sk-demo}
      # DeepSeek 为 OpenAI 兼容接口；换通义改成 https://dashscope.aliyuncs.com/compatible-mode/v1
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${LLM_MODEL:deepseek-chat}
# 若走本地 Ollama：删除上面的 openai 段，改用 ollama starter 并配置：
