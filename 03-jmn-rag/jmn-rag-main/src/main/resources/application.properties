server.port=8802
server.servlet.context-path=/rag/be
spring.application.name=jmn-rag

# ===== 大模型接入（OpenAI兼容中转站） =====
spring.ai.openai.api-key=${LLM_API_KEY:sk-demo}
spring.ai.openai.base-url=${LLM_BASE_URL:https://api.deepseek.com}
spring.ai.openai.chat.options.model=${LLM_MODEL:deepseek-flash}
spring.ai.openai.chat.options.temperature=0.3

# ===== RAG 配置 =====
# 向量化实现：local（本地哈希向量，离线可用） / openai（中转站embeddings，当前未开通503）
rag.embedding.mode=local
rag.data-dir=./data/docs
rag.store-path=./data/vector-store.json
rag.chunk-size=500
rag.top-k=4

# ===== 接口文档 =====
knife4j.enable=true
knife4j.setting.language=zh_cn

spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=120s
